name: Build & Publish Release APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'
          cache-disabled: true

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build APK with Permanent Keystore
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare Release Artifacts
        run: |
          VERSION_TAG="${GITHUB_REF_NAME:-v1.0.0}"
          if [[ "$VERSION_TAG" != v* ]]; then
            VERSION_TAG="v1.0.0"
          fi
          mkdir -p build/release-assets
          
          # Find generated APK and copy to release folder
          APK_FILE=$(find app/build/outputs/apk -name "*release*.apk" -o -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            echo "Found APK: $APK_FILE"
            cp "$APK_FILE" "build/release-assets/MusicHub-${VERSION_TAG}.apk"
          else
            echo "Error: No APK file generated"
            exit 1
          fi

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicHub-Release-APK
          path: build/release-assets/*.apk
          retention-days: 30

      - name: Create or Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          name: MusicHub ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          files: build/release-assets/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
